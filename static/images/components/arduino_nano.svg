<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Studio Backdrop -->
  <rect width="320" height="240" fill="url(#bgGrad)" rx="16"/>
  <!-- Hardware Subject -->
  <g filter="url(#softShadow)">
    
  <!-- Blue Mini PCB -->
  <rect x="90" y="60" width="140" height="120" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Mini USB at left -->
  <rect x="78" y="105" width="22" height="30" rx="2" fill="url(#silverMetal)" stroke="#64748b"/>
  <!-- ATmega TQFP Square Chip in center -->
  <rect x="145" y="105" width="30" height="30" rx="2" fill="#0f172a" stroke="#334155"/>
  <circle cx="150" cy="110" r="1.5" fill="#f8fafc"/>
  <text x="160" y="95" font-size="10" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">NANO</text>
  <!-- Top and Bottom Pin Rows -->
  <g stroke="url(#goldPin)" stroke-width="2.2" stroke-linecap="round">
    <line x1="105" y1="52" x2="105" y2="60"/><line x1="105" y1="180" x2="105" y2="188"/><line x1="113" y1="52" x2="113" y2="60"/><line x1="113" y1="180" x2="113" y2="188"/><line x1="121" y1="52" x2="121" y2="60"/><line x1="121" y1="180" x2="121" y2="188"/><line x1="129" y1="52" x2="129" y2="60"/><line x1="129" y1="180" x2="129" y2="188"/><line x1="137" y1="52" x2="137" y2="60"/><line x1="137" y1="180" x2="137" y2="188"/><line x1="145" y1="52" x2="145" y2="60"/><line x1="145" y1="180" x2="145" y2="188"/><line x1="153" y1="52" x2="153" y2="60"/><line x1="153" y1="180" x2="153" y2="188"/><line x1="161" y1="52" x2="161" y2="60"/><line x1="161" y1="180" x2="161" y2="188"/><line x1="169" y1="52" x2="169" y2="60"/><line x1="169" y1="180" x2="169" y2="188"/><line x1="177" y1="52" x2="177" y2="60"/><line x1="177" y1="180" x2="177" y2="188"/><line x1="185" y1="52" x2="185" y2="60"/><line x1="185" y1="180" x2="185" y2="188"/><line x1="193" y1="52" x2="193" y2="60"/><line x1="193" y1="180" x2="193" y2="188"/><line x1="201" y1="52" x2="201" y2="60"/><line x1="201" y1="180" x2="201" y2="188"/><line x1="209" y1="52" x2="209" y2="60"/><line x1="209" y1="180" x2="209" y2="188"/><line x1="217" y1="52" x2="217" y2="60"/><line x1="217" y1="180" x2="217" y2="188"/>
  </g>

  </g>
</svg>