<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Studio Backdrop -->
  <rect width="320" height="240" fill="url(#bgGrad)" rx="16"/>
  <!-- Hardware Subject -->
  <g filter="url(#softShadow)">
    
  <!-- Blue Perforated Housing -->
  <rect x="110" y="70" width="100" height="110" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Wave grid vents -->
  <g fill="#0369a1">
    <rect x="125" y="85" width="10" height="6" rx="2"/><rect x="125" y="100" width="10" height="6" rx="2"/><rect x="125" y="115" width="10" height="6" rx="2"/><rect x="125" y="130" width="10" height="6" rx="2"/><rect x="143" y="85" width="10" height="6" rx="2"/><rect x="143" y="100" width="10" height="6" rx="2"/><rect x="143" y="115" width="10" height="6" rx="2"/><rect x="143" y="130" width="10" height="6" rx="2"/><rect x="161" y="85" width="10" height="6" rx="2"/><rect x="161" y="100" width="10" height="6" rx="2"/><rect x="161" y="115" width="10" height="6" rx="2"/><rect x="161" y="130" width="10" height="6" rx="2"/><rect x="179" y="85" width="10" height="6" rx="2"/><rect x="179" y="100" width="10" height="6" rx="2"/><rect x="179" y="115" width="10" height="6" rx="2"/><rect x="179" y="130" width="10" height="6" rx="2"/>
  </g>
  <!-- Label -->
  <text x="160" y="165" font-size="11" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">DHT11</text>
  <!-- 4 Connector Pins at bottom -->
  <line x1="130" y1="180" x2="130" y2="205" stroke="url(#silverMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="180" x2="150" y2="205" stroke="url(#silverMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="170" y1="180" x2="170" y2="205" stroke="url(#silverMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="190" y1="180" x2="190" y2="205" stroke="url(#silverMetal)" stroke-width="2.5" stroke-linecap="round"/>

  </g>
</svg>