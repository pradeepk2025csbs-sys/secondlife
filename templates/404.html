{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
                <div class="display-1 fw-bold text-success mb-2">404</div>
                <div class="fs-1 text-muted mb-3"><i class="bi bi-robot"></i></div>
                <h3 class="fw-bold mb-2">Component Not Found</h3>
                <p class="text-muted mb-4">
                    The page or resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house me-1"></i>Back to Home
                    </a>
                    <a href="{{ url_for('projects.project_list') }}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-lightbulb me-1"></i>Browse Projects
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
