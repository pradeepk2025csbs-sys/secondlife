{% extends "base.html" %}
{% block title %}Internal Server Error - 500{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
                <div class="display-1 fw-bold text-danger mb-2">500</div>
                <div class="fs-1 text-muted mb-3"><i class="bi bi-exclamation-triangle"></i></div>
                <h3 class="fw-bold mb-2">Something Went Wrong</h3>
                <p class="text-muted mb-4">
                    Our circuits crossed on this request. Our team has been notified, and we are working to restore the connection.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house me-1"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
